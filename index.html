<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LASAI QR Code Generator</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='15' fill='white' stroke='black' stroke-width='6'/%3E%3Cpath fill='black' d='M20 20h20v20H20zM25 25h10v10H25zM60 20h20v20H60zM65 25h10v10H65zM20 60h20v20H20zM25 65h10v10H25zM45 20h10v10H45zM45 35h10v20H45zM45 60h10v20H45zM60 45h20v10H60zM60 60h10v10H60zM75 60h5v20h-5z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>LASAI QR Code Generator</h1>
    <div class="container">
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Enter URL here (D'oh!)">
            <button class="clear-input-btn" onclick="clearInput()" title="Clear URL">X</button>
        </div>
        <div class="input-group">
            <input type="file" id="logoInput" accept="image/*" title="Upload a logo (optional)">
            <button class="clear-input-btn" onclick="clearLogo()" title="Clear Logo">X</button>
        </div>
        <div class="action-buttons">
            <select id="logoSizeSelect" class="size-select" title="Logo Size">
                <option value="0.10">Small Logo (10%)</option>
                <option value="0.20">Medium Logo (20%)</option>
                <option value="0.30" selected>Large Logo (30%)</option>
            </select>
            <select id="sizeSelect" class="size-select" title="QR Code Size">
                <option value="500">500x500</option>
                <option value="800">800x800</option>
                <option value="1000">1000x1000</option>
            </select>
            <button class="main-btn" onclick="generateQRCode()">Make QR Code!</button>
            <button class="secondary-btn" id="clearImageBtn" onclick="clearImage()" style="display: none;">Clear Image</button>
        </div>
        
        <div class="canvas-container" id="canvasContainer">
            <canvas id="qrcodeCanvas"></canvas>
            <a id="downloadLink" class="download-btn" download="qrcode.png">Download</a>
        </div>
    </div>
    <footer>
        <p>Mm... QR Codes...</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
